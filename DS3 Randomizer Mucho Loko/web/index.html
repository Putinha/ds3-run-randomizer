<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DS3 Randomizer</title>

<style>
:root{color-scheme:dark}
*{box-sizing:border-box}

body{
    margin:0;
    background:#111;
    color:#eee;
    font:15px system-ui,sans-serif;
}

main{
    width:min(900px,92%);
    margin:40px auto;
}

.panel{
    background:#191919;
    border:1px solid #333;
    border-radius:10px;
    padding:20px;
    margin:18px 0;
}

.options{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
}

.option{
    padding:12px;
    border:1px solid #333;
    border-radius:7px;
}

.option.disabled{
    opacity:.4;
}

.seed{
    width:100%;
    max-width:360px;
    padding:11px;
    background:#111;
    border:1px solid #444;
    color:#fff;
    border-radius:6px;
}

button{
    margin-top:16px;
    padding:11px 22px;
    border:0;
    border-radius:6px;
    background:#ddd;
    color:#111;
    font-weight:700;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
}

.ok{
    color:#8fd18f;
}

.error{
    color:#f88;
}

.weapon{
    display:flex;
    align-items:center;
    gap:30px;
    margin-top:25px;
}

.weapon img{
    width:128px;
    height:128px;
    border:1px solid #444;
    border-radius:8px;
    background:#222;
}

.weapon h2{
    margin:0;
    font-size:30px;
}

.result-section{
    margin:15px 0;
}

.result-section h3{
    margin:0 0 8px 0;
    font-size:18px;
    color:#ccc;
}

.result-section ul{
    margin:5px 0;
    padding-left:20px;
    list-style-type:none;
}

.result-section li{
    padding:3px 0;
}

.full-run-results .result-section{
    background:#222;
    border:1px solid #333;
    border-radius:8px;
    padding:15px;
}

.full-run-weapons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-top:12px;
}

.full-run-weapon{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:6px;
    padding:14px;
    background:#111;
    border:1px solid #333;
    border-radius:8px;
}

.full-run-weapon img{
    width:128px;
    height:128px;
    object-fit:contain;
    background:#222;
    border-radius:6px;
}

.full-run-weapon strong{
    margin-top:4px;
}

.full-run-weapon span{
    color:#aaa;
}

@media(max-width:650px){
    .full-run-weapons{
        grid-template-columns:1fr;
    }
}

.full-run-rings{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-top:12px;
}

.full-run-ring{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:6px;
    padding:14px;
    background:#111;
    border:1px solid #333;
    border-radius:8px;
}

.full-run-ring img{
    width:96px;
    height:96px;
    object-fit:contain;
    background:#222;
    border-radius:6px;
}

.full-run-ring span{
    color:#aaa;
}

@media(max-width:650px){
    .full-run-rings{
        grid-template-columns:repeat(2,1fr);
    }
}
.full-run-magic{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
    margin-top:12px;
}

.full-run-magic-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:6px;
    padding:14px;
    background:#111;
    border:1px solid #333;
    border-radius:8px;
}

.full-run-magic-item img{
    width:128px;
    height:128px;
    object-fit:contain;
    background:#222;
    border-radius:6px;
}

.full-run-magic-item span{
    color:#aaa;
}

@media(max-width:650px){
    .full-run-magic{
        grid-template-columns:1fr;
    }
}
.full-run-shield{
    display:flex;
    justify-content:center;
    margin-top:12px;
}

.full-run-shield-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:6px;
    padding:14px;
    background:#111;
    border:1px solid #333;
    border-radius:8px;
    min-width:180px;
}

.full-run-shield-item img{
    width:128px;
    height:128px;
    object-fit:contain;
    background:#222;
    border-radius:6px;
}

.full-run-shield-item span{
    color:#aaa;
}
</style>
</head>

<body>

<main>

<h1>Dark Souls III Randomizer</h1>

<section class="panel">

<h2>Randomization</h2>

<div id="categories" class="options"></div>

<div class="options">
<label class="option">
<input type="checkbox" id="full-run-checkbox">
Full Run
</label>
</div>

<h2>Seed</h2>

<input
id="seed"
class="seed"
type="number"
placeholder="Random Seed">

<br>

<button id="generate">
Generate Randomizer
</button>

<div id="status"></div>

</section>

<section id="results" class="panel" hidden>

<h2>Randomized Weapon</h2>

<div id="summary"></div>

<div class="weapon">

<img
id="weapon-image"
src="test.png"
alt="Weapon">

<h2 id="weapon-name"></h2>

</div>

</section>

<section id="full-run-results" class="panel full-run-results" hidden>

<h2>Full Run</h2>

<div id="full-run-summary"></div>

<div id="full-run-content"></div>

</section>

</main>

<script>

const categories=document.getElementById("categories");
const seed=document.getElementById("seed");
const button=document.getElementById("generate");
const status=document.getElementById("status");
const results=document.getElementById("results");
const summary=document.getElementById("summary");
const weaponName=document.getElementById("weapon-name");
const weaponImage=document.getElementById("weapon-image");
const fullRunCheckbox=document.getElementById("full-run-checkbox");
function getWeaponImage(name) {
    if (!name) {
        return "test.png";
    }

    const filename = name
        .toLowerCase()
        .replaceAll(" ", "_")
        .replaceAll("'", "_")
        .replaceAll("-", "_");

    return "/static/images/weapons/" + filename + ".png";
}
function getRingImage(name) {
    if (!name) {
        return "test.png";
    }

    const filename = name
        .toLowerCase()
        .replaceAll(" ", "_")
        .replaceAll("'", "_")
        .replaceAll("-", "_");

    return "/static/images/rings/" + filename + ".png";
}
const fullRunResults=document.getElementById("full-run-results");
const fullRunSummary=document.getElementById("full-run-summary");
const fullRunContent=document.getElementById("full-run-content");

async function init(){

    const r=await fetch("/api/config");
    const data=await r.json();

    categories.innerHTML=data.categories.map(c=>`
<label class="option ${c.available?"":"disabled"}">
<input
type="checkbox"
data-id="${c.id}"
${c.available?"checked":"disabled"}>
${c.name}${c.available?"":" (coming soon)"}
</label>`).join("");

}

function safeValue(val) {
    if (val === null || val === undefined) return "None";
    return val;
}

function displayFullRun(data) {
    fullRunSummary.innerHTML = `<p><strong>Seed:</strong> ${data.seed}</p>`;
    
    let html = "";
    
    // Starting Class section
html += `
<div class="result-section">
<h3>Starting Class</h3>
<p><strong>${safeValue(data.starting_class)}</strong></p>
</div>
`;
    
// Final Weapon section
html += `
<div class="result-section">
<h3>Final Weapon</h3>

<div class="full-run-weapons">

<div class="full-run-weapon">
<img
src="${getWeaponImage(data.weapon)}"
alt="${safeValue(data.weapon)}">

<strong>Final Weapon</strong>
<span>${safeValue(data.weapon)}</span>
</div>

</div>
</div>
`;
    
// Magic section
html += `
<div class="result-section">
<h3>Magic</h3>

<div class="full-run-magic">

<div class="full-run-magic-item">
<img
src="${getMagicImage(data.magic && data.magic.spell)}"
alt="${safeValue(data.magic && data.magic.spell)}">

<strong>Spell</strong>
<span>${safeValue(data.magic && data.magic.spell)}</span>

</div>

<div class="full-run-magic-item">
<img
src="${getCatalystImage(data.magic && data.magic.catalyst)}"
alt="${safeValue(data.magic && data.magic.catalyst)}">

<strong>Catalyst</strong>
<span>${safeValue(data.magic && data.magic.catalyst)}</span>

</div>

</div>

<p>
<strong>School:</strong>
${safeValue(data.magic && data.magic.school)}
</p>

</div>
`;
    
// Shield section
html += `
<div class="result-section">
<h3>Shield</h3>

${
    data.shield
    ? `
    <div class="full-run-shield">

        <div class="full-run-shield-item">
            <img
                src="${getShieldImage(data.shield)}"
                alt="${safeValue(data.shield)}">

            <strong>Shield</strong>
            <span>${safeValue(data.shield)}</span>
        </div>

    </div>
    `
    : `
    <p><strong>Shield:</strong> None</p>
    `
}

</div>
`;
    
    // Rings section
html += `
<div class="result-section">
<h3>Rings</h3>

<div class="full-run-rings">

<div class="full-run-ring">
<img
src="${getRingImage(data.rings[0])}"
alt="${safeValue(data.rings[0])}">
<strong>Ring #1</strong>
<span>${safeValue(data.rings[0])}</span>
</div>

<div class="full-run-ring">
<img
src="${getRingImage(data.rings[1])}"
alt="${safeValue(data.rings[1])}">
<strong>Ring #2</strong>
<span>${safeValue(data.rings[1])}</span>
</div>

<div class="full-run-ring">
<img
src="${getRingImage(data.rings[2])}"
alt="${safeValue(data.rings[2])}">
<strong>Ring #3</strong>
<span>${safeValue(data.rings[2])}</span>
</div>

<div class="full-run-ring">
<img
src="${getRingImage(data.rings[3])}"
alt="${safeValue(data.rings[3])}">
<strong>Ring #4</strong>
<span>${safeValue(data.rings[3])}</span>
</div>

</div>
</div>
`;

    // Magic section
function getMagicImage(name) {
    if (!name) {
        return "test.png";
    }

    const filename = name
        .toLowerCase()
        .replaceAll(" ", "_")
        .replaceAll("'", "_")
        .replaceAll("-", "_");

    return "/static/images/magic/" + filename + ".png";
}

    // Catalyst section
function getCatalystImage(name) {
    if (!name) {
        return "test.png";
    }

    const filename = name
        .toLowerCase()
        .replaceAll(" ", "_")
        .replaceAll("'", "_")
        .replaceAll("-", "_");

    return "/static/images/catalysts/" + filename + ".png";
}

    // Shield section
function getShieldImage(name) {
    if (!name) {
        return null;
    }

    const filename = name
        .toLowerCase()
        .replaceAll(" ", "_")
        .replaceAll("'", "_")
        .replaceAll("-", "_");

    return "/static/images/shields/" + filename + ".png";
}
    
    // Character section
    html += `
<div class="result-section">
<h3>Character</h3>
<ul>
<li><strong>Final Level:</strong> ${safeValue(data.character.final_level)}</li>
</ul>
</div>
`;
    
    fullRunContent.innerHTML = html;
    fullRunResults.hidden = false;
}

async function generate(){

    const isFullRun = fullRunCheckbox.checked;
    const checked=[...document.querySelectorAll("#categories input:checked")]
        .map(x=>x.dataset.id);

    button.disabled=true;

    status.textContent="Generating...";

    results.hidden=true;
    fullRunResults.hidden=true;

    try{

        let body={};
        
        if(seed.value.trim())
            body.seed=Number(seed.value);

        let r;
        if (isFullRun) {
            r = await fetch("/api/full-run", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
            });
        } else {
            body.categories = checked;
            r = await fetch("/api/randomize", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
            });
        }

        const data=await r.json();

        if(!r.ok)
            throw new Error(data.error);

        if (isFullRun) {
            displayFullRun(data);
        } else {
            const weapon=data.weapon;

            if(!weapon || !weapon.randomized){
                throw new Error("Randomizer returned no weapon.");
        }

            summary.innerHTML=`
<p>
<strong>Seed:</strong> ${data.seed}
&nbsp;
<span class="ok">✓ Valid progression</span>
</p>`;

            weaponName.textContent=weapon.randomized;

            weaponImage.src=getWeaponImage(weapon.randomized);

            results.hidden=false;
        }

        status.textContent="Done.";

    }

    catch(e){

        status.innerHTML=`<span class="error">${e.message}</span>`;

    }

    finally{

        button.disabled=false;

    }

}

button.onclick=generate;

init();

</script>

</body>
</html>
